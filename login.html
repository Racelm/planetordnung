<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planet Ordnung – Anmeldung</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  min-height:100vh;
  background:linear-gradient(135deg,#0f2044 0%,#1e3a5f 50%,#1d4ed8 100%);
  display:flex;align-items:center;justify-content:center;
  padding:20px;
}
.container{width:100%;max-width:420px;animation:fadeIn .5s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.logo-area{text-align:center;margin-bottom:40px}
.logo-icon{width:80px;height:80px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:2.5rem;margin:0 auto 16px;box-shadow:0 12px 40px rgba(59,130,246,.4)}
.logo-title{font-size:1.8rem;font-weight:900;color:#fff;letter-spacing:-.5px;margin-bottom:6px}
.logo-sub{font-size:.9rem;color:rgba(255,255,255,.6)}
.card{background:rgba(255,255,255,.07);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.15);border-radius:24px;padding:36px 32px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.card-title{font-size:1.2rem;font-weight:800;color:#fff;margin-bottom:8px;text-align:center}
.card-sub{font-size:.85rem;color:rgba(255,255,255,.5);text-align:center;margin-bottom:32px}
.btn-google{width:100%;padding:16px;background:#fff;border:none;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:1rem;font-weight:700;color:#1e293b;cursor:pointer;transition:all .2s;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.btn-google:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.btn-google:disabled{opacity:.7;cursor:not-allowed;transform:none}
.status{text-align:center;margin-top:20px;color:rgba(255,255,255,.7);font-size:.85rem;min-height:24px}
.features{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px}
.feature{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:14px 12px;text-align:center}
.feature-icon{font-size:1.4rem;margin-bottom:6px}
.feature-text{font-size:.72rem;color:rgba(255,255,255,.5);font-weight:600}
.footer{text-align:center;margin-top:24px;color:rgba(255,255,255,.3);font-size:.75rem}
</style>
</head>
<body>
<div class="container">
  <div class="logo-area">
    <div class="logo-icon">🌍</div>
    <div class="logo-title">Planet Ordnung</div>
    <div class="logo-sub">Ordentlich. Organisiert. Mit Herz.</div>
  </div>
  <div class="card">
    <div class="card-title">Willkommen zurück</div>
    <div class="card-sub">Melden Sie sich an um fortzufahren</div>
    <button class="btn-google" id="btn-login">
      <svg width="22" height="22" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Mit Google anmelden
    </button>
    <div class="status" id="status"></div>
    <div class="features">
      <div class="feature"><div class="feature-icon">👥</div><div class="feature-text">Kundenverwaltung</div></div>
      <div class="feature"><div class="feature-icon">📋</div><div class="feature-text">Einsätze</div></div>
      <div class="feature"><div class="feature-icon">🧾</div><div class="feature-text">Rechnungen</div></div>
      <div class="feature"><div class="feature-icon">💰</div><div class="feature-text">Buchhaltung</div></div>
    </div>
  </div>
  <div class="footer">© 2026 Planet Ordnung · Alle Daten verschlüsselt</div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, signInWithRedirect, getRedirectResult, GoogleAuthProvider, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

const firebaseConfig = {
  apiKey: "AIzaSyD1zqARVE6BvsdvKY14Sdnrsbl09Pq6gtE",
  authDomain: "planetordnung.firebaseapp.com",
  projectId: "planetordnung",
  storageBucket: "planetordnung.firebasestorage.app",
  messagingSenderId: "26748234621",
  appId: "1:26748234621:web:a65c90b5807f6fa70afa14"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();
const btn = document.getElementById('btn-login');
const status = document.getElementById('status');

// Redirect-Ergebnis prüfen
status.textContent = '⏳ Wird geprüft...';
try {
  const result = await getRedirectResult(auth);
  if(result?.user) {
    status.textContent = '✅ Erfolgreich! Wird weitergeleitet...';
    window.location.href = 'index.html';
  } else {
    status.textContent = '';
  }
} catch(e) {
  status.textContent = '';
  console.log('Redirect check:', e.code);
}

// Wenn schon eingeloggt
onAuthStateChanged(auth, user => {
  if(user) {
    status.textContent = '✅ Wird weitergeleitet...';
    setTimeout(() => window.location.href = 'index.html', 500);
  }
});

// Login Button
btn.addEventListener('click', async () => {
  btn.disabled = true;
  btn.textContent = '⏳ Wird angemeldet...';
  status.textContent = 'Bitte warten...';
  try {
    await signInWithRedirect(auth, provider);
  } catch(e) {
    status.textContent = '❌ Fehler: ' + e.message;
    btn.disabled = false;
    btn.textContent = 'Mit Google anmelden';
  }
});
</script>
</body>
</html>
