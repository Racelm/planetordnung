<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Planet Ordnung</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#1e3a5f;--blue2:#2563eb;--grn:#059669;--red:#dc2626;--orn:#f97316;--pur:#7c3aed;--bg:#f1f5f9;--bg2:#fff;--brd:#e2e8f0;--txt:#1e293b;--txt2:#64748b;--txt3:#94a3b8}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt)}
input,select,textarea,button{font-family:inherit}
.hide{display:none!important}
/* HEADER */
#header{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.15)}
#header h1{font-size:1.05rem;font-weight:800;display:flex;align-items:center;gap:8px}
#user-badge{font-size:.78rem;opacity:.9}
#btn-logout{background:rgba(255,255,255,.2);border:none;color:#fff;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:.8rem}
/* NAV */
#bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--brd);display:flex;z-index:100;box-shadow:0 -2px 12px rgba(0,0,0,.08)}
.nav-btn{flex:1;padding:8px 4px;border:none;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--txt3);font-size:.6rem;font-weight:600;transition:color .2s}
.nav-btn.active{color:var(--blue2)}
.nav-btn span:first-child{font-size:1.3rem}
/* MAIN */
#app{padding:16px;padding-bottom:80px;max-width:800px;margin:0 auto}
/* VIEWS */
.view{display:none}
.view.active{display:block}
/* CARDS */
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card-title{font-weight:700;color:var(--blue2);font-size:.82rem;margin-bottom:14px;text-transform:uppercase;letter-spacing:.5px}
/* BUTTONS */
.btn{padding:12px 20px;border:none;border-radius:12px;font-weight:700;cursor:pointer;font-size:.9rem;transition:all .15s}
.btn-primary{background:var(--blue2);color:#fff}
.btn-green{background:var(--grn);color:#fff}
.btn-red{background:var(--red);color:#fff}
.btn-gray{background:var(--bg);color:var(--txt2)}
.btn-full{width:100%;padding:14px}
.btn-sm{padding:7px 12px;font-size:.78rem;border-radius:8px}
/* FORM */
.f-group{margin-bottom:14px}
.f-group label{display:block;font-size:.78rem;font-weight:700;color:var(--txt2);margin-bottom:5px}
.f-group input,.f-group select,.f-group textarea{width:100%;padding:11px 13px;border-radius:10px;border:1.5px solid var(--brd);font-size:.9rem;outline:none;transition:border .2s;background:#fff}
.f-group input:focus,.f-group select:focus,.f-group textarea:focus{border-color:var(--blue2)}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* LIST ITEMS */
.list-item{background:#fff;border-radius:14px;padding:15px;margin-bottom:8px;box-shadow:0 2px 6px rgba(0,0,0,.05);display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:transform .15s}
.list-item:hover{transform:translateY(-1px)}
.list-item-left{flex:1}
.list-item-title{font-weight:700;color:var(--txt);margin-bottom:3px}
.list-item-sub{font-size:.78rem;color:var(--txt2)}
.list-item-right{display:flex;gap:8px;align-items:center}
/* BADGES */
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.7rem;font-weight:700}
.badge-green{background:#dcfce7;color:var(--grn)}
.badge-yellow{background:#fef3c7;color:#d97706}
.badge-red{background:#fee2e2;color:var(--red)}
.badge-blue{background:#dbeafe;color:var(--blue2)}
.badge-gray{background:#f1f5f9;color:var(--txt2)}
/* QUICK BTNS */
.quick-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin-bottom:20px}
.quick-btn{border:none;border-radius:14px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-size:.72rem;font-weight:700;color:#fff;transition:transform .15s;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.quick-btn:hover{transform:scale(1.04)}
.quick-btn span:first-child{font-size:1.5rem}
/* STATS */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.stat-card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer}
.stat-val{font-size:1.6rem;font-weight:800;margin-bottom:4px}
.stat-lbl{font-size:.75rem;color:var(--txt2);font-weight:600}
/* BACK BTN */
.back-btn{background:none;border:none;font-size:1.4rem;cursor:pointer;padding:4px;margin-right:8px}
.page-title{display:flex;align-items:center;margin-bottom:20px}
.page-title h2{font-size:1.15rem;font-weight:800;flex:1}
/* CHIPS */
.chip-group{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{padding:7px 14px;border-radius:20px;border:none;cursor:pointer;font-size:.8rem;font-weight:600;background:var(--bg);color:var(--txt2);transition:all .15s}
.chip.active{background:var(--blue2);color:#fff}
/* TOAST */
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:12px 20px;border-radius:12px;font-size:.85rem;font-weight:600;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
/* CANVAS */
canvas{border:1.5px solid var(--brd);border-radius:10px;width:100%;touch-action:none;background:#fafafa}
/* FILTER TABS */
.filter-tabs{display:flex;gap:8px;margin-bottom:16px}
.filter-tab{padding:8px 16px;border-radius:20px;border:none;cursor:pointer;font-weight:600;font-size:.8rem;background:var(--bg);color:var(--txt2);transition:all .2s}
.filter-tab.active{background:var(--blue2);color:#fff}
/* BILANZ */
.bilanz-card{background:linear-gradient(135deg,var(--blue),var(--blue2));border-radius:16px;padding:20px;color:#fff;margin-bottom:16px}
/* LOADER */

</style>
</head>
<body>

<div id="main-ui">
  <div id="header">
    <h1><span>🌍</span> Planet Ordnung</h1>
    <div style="display:flex;align-items:center;gap:10px">
      <span id="user-badge">Karin Koch</span>
    </div>
  </div>

  <div id="app">
    <!-- HOME -->
    <div id="v-home" class="view active">
      <div style="margin-bottom:20px">
        <h2 style="font-size:1.3rem;font-weight:800;margin-bottom:4px">Guten Tag! 👋</h2>
        <p id="today-date" style="color:var(--txt2);font-size:.85rem"></p>
      </div>
      <div class="quick-grid">
        <button class="quick-btn" style="background:var(--blue2)" onclick="showPage('kunden-neu')"><span>👥</span>Kunde</button>
        <button class="quick-btn" style="background:var(--pur)" onclick="showPage('einsatz-neu')"><span>📋</span>Einsatz</button>
        <button class="quick-btn" style="background:var(--grn)" onclick="showPage('rechnung-neu')"><span>🧾</span>Rechnung</button>
        <button class="quick-btn" style="background:var(--orn)" onclick="showPage('termin-neu')"><span>📅</span>Termin</button>
      </div>
      <div class="stats-grid" id="home-stats"></div>
      <div class="bilanz-card" id="home-bilanz"></div>
    </div>

    <!-- KUNDEN LISTE -->
    <div id="v-kunden" class="view">
      <div class="page-title">
        <h2>👥 Kunden</h2>
        <button class="btn btn-primary btn-sm" onclick="showPage('kunden-neu')">+ Neu</button>
      </div>
      <div class="f-group"><input type="search" id="kunden-search" placeholder="🔍 Suchen..." oninput="filterKunden()"></div>
      <div class="filter-tabs">
        <button class="filter-tab active" onclick="setKundenFilter('alle',this)">Alle</button>
        <button class="filter-tab" onclick="setKundenFilter('aktiv',this)">Aktiv</button>
        <button class="filter-tab" onclick="setKundenFilter('archiviert',this)">Archiviert</button>
      </div>
      <div id="kunden-list"></div>
    </div>

    <!-- KUNDE FORM -->
    <div id="v-kunden-form" class="view">
      <div class="page-title">
        <button class="back-btn" onclick="showPage('kunden')">←</button>
        <h2 id="kunden-form-title">Neuer Kunde</h2>
      </div>
      <div class="card">
        <div class="card-title">Stammdaten</div>
        <div class="f-group"><label>Kundennummer</label><input id="k-nr" placeholder="z.B. KD-001"></div>
        <div class="f-row">
          <div class="f-group"><label>Nachname *</label><input id="k-name" required></div>
          <div class="f-group"><label>Vorname *</label><input id="k-vorname" required></div>
        </div>
        <div class="f-group"><label>Geburtsdatum</label><input id="k-geb" type="date"></div>
        <div class="f-group"><label>Adresse</label><input id="k-adresse"></div>
        <div class="f-row">
          <div class="f-group"><label>Festnetz</label><input id="k-festnetz" type="tel"></div>
          <div class="f-group"><label>Handy</label><input id="k-handy" type="tel"></div>
        </div>
        <div class="f-group"><label>E-Mail</label><input id="k-email" type="email"></div>
        <div class="f-group"><label>Status</label>
          <select id="k-status">
            <option value="aktiv">Aktiv</option>
            <option value="archiviert">Archiviert</option>
            <option value="verstorben">Verstorben</option>
          </select>
        </div>
        <div class="f-group" id="k-sterbe-group" style="display:none"><label>Sterbedatum</label><input id="k-sterbe" type="date"></div>
      </div>
      <div class="card">
        <div class="card-title">Versicherung</div>
        <div class="f-row">
          <div class="f-group"><label>PKV 70% Name</label><input id="k-pkv70name"></div>
          <div class="f-group"><label>PKV 70% Nr.</label><input id="k-pkv70"></div>
        </div>
        <div class="f-row">
          <div class="f-group"><label>PKV 30% Name</label><input id="k-pkv30name"></div>
          <div class="f-group"><label>PKV 30% Nr.</label><input id="k-pkv30"></div>
        </div>
        <div class="f-row">
          <div class="f-group"><label>GKV Name</label><input id="k-gkvname"></div>
          <div class="f-group"><label>GKV Nr.</label><input id="k-gkv"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-title">Medizinisch</div>
        <div class="f-group"><label>Arzt</label><input id="k-arzt"></div>
        <div class="f-group"><label>Praxis</label><input id="k-praxis"></div>
        <div class="f-group"><label>Apotheke</label><input id="k-apotheke"></div>
      </div>
      <div class="card">
        <div class="card-title">Kontaktperson</div>
        <div class="f-group"><label>Name</label><input id="k-kpname"></div>
        <div class="f-row">
          <div class="f-group"><label>Kontakt</label><input id="k-kptel"></div>
          <div class="f-group"><label>Beziehung</label><input id="k-kpbez"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-title">Vollmachten</div>
        <label style="display:flex;align-items:center;gap:10px;margin-bottom:10px;cursor:pointer"><input type="checkbox" id="k-bank"> <span>Bankvollmacht</span></label>
        <label style="display:flex;align-items:center;gap:10px;margin-bottom:10px;cursor:pointer"><input type="checkbox" id="k-vorsorge"> <span>Vorsorgevollmacht</span></label>
        <label style="display:flex;align-items:center;gap:10px;cursor:pointer"><input type="checkbox" id="k-patient"> <span>Patientenverfügung</span></label>
      </div>
      <div class="card">
        <div class="card-title">Notizen</div>
        <div class="f-group"><textarea id="k-notizen" rows="4"></textarea></div>
      </div>
      <input type="hidden" id="k-id">
      <div style="display:flex;gap:10px;margin-bottom:20px">
        <button class="btn btn-gray btn-full" onclick="showPage('kunden')">Abbrechen</button>
        <button class="btn btn-primary btn-full" onclick="saveKunde()">💾 Speichern</button>
      </div>
    </div>

    <!-- EINSÄTZE -->
    <div id="v-einsaetze" class="view">
      <div class="page-title">
        <h2>📋 Einsätze</h2>
        <button class="btn btn-primary btn-sm" style="background:var(--pur)" onclick="showPage('einsatz-neu')">+ Neu</button>
      </div>
      <div class="filter-tabs">
        <button class="filter-tab active" onclick="setEinsatzFilter('alle',this)">Alle</button>
        <button class="filter-tab" onclick="setEinsatzFilter('offen',this)">Offen</button>
        <button class="filter-tab" onclick="setEinsatzFilter('abgerechnet',this)">Abgerechnet</button>
      </div>
      <div id="einsaetze-list"></div>
    </div>

    <!-- EINSATZ FORM -->
    <div id="v-einsatz-form" class="view">
      <div class="page-title">
        <button class="back-btn" onclick="showPage('einsaetze')">←</button>
        <h2>Neuer Einsatz</h2>
      </div>
      <div class="card">
        <div class="f-group"><label>Kunde *</label>
          <select id="e-kunde"><option value="">-- Kunde wählen --</option></select>
        </div>
        <div class="f-group"><label>Datum *</label><input id="e-datum" type="date"></div>
        <div class="f-row">
          <div class="f-group"><label>Anfang</label><input id="e-anfang" type="time"></div>
          <div class="f-group"><label>Ende</label><input id="e-ende" type="time"></div>
        </div>
        <div id="e-stunden-info" style="background:#f0fdf4;border-radius:8px;padding:8px 12px;margin-bottom:14px;color:var(--grn);font-size:.85rem;font-weight:700;display:none"></div>
        <div class="f-group"><label>Leistungsart</label>
          <select id="e-leistung">
            <option value="Alltagsbegleitung">Alltagsbegleitung (28,61 €/h)</option>
            <option value="Coaching 1h">Coaching 1h (67,23 €/h)</option>
            <option value="Coaching 4h">Coaching 4h (42,02 €/h)</option>
          </select>
        </div>
        <div class="f-group"><label>Aktivitäten</label>
          <div class="chip-group" id="e-aktivitaeten"></div>
        </div>
        <div class="f-group"><label>Kilometer</label><input id="e-km" type="number" min="0" value="0" oninput="updateKmInfo()"></div>
        <div id="e-km-info" style="font-size:.75rem;color:var(--txt2);margin-top:-8px;margin-bottom:14px"></div>
        <div class="f-group"><label>Notizen</label><textarea id="e-notizen" rows="3"></textarea></div>
        <div class="f-group"><label>Unterschrift</label>
          <canvas id="e-canvas" width="300" height="120"></canvas>
          <button class="btn btn-gray btn-sm" style="margin-top:6px" onclick="clearCanvas()">Löschen</button>
        </div>
      </div>
      <button class="btn btn-full" style="background:var(--pur);color:#fff;margin-bottom:20px" onclick="saveEinsatz()">📋 Einsatz speichern</button>
    </div>

    <!-- RECHNUNGEN -->
    <div id="v-rechnungen" class="view">
      <div class="page-title">
        <h2>🧾 Rechnungen</h2>
        <button class="btn btn-sm btn-green" onclick="showPage('rechnung-neu')">+ Neu</button>
      </div>
      <div class="filter-tabs">
        <button class="filter-tab active" onclick="setRecFilter('alle',this)">Alle</button>
        <button class="filter-tab" onclick="setRecFilter('offen',this)">Offen</button>
        <button class="filter-tab" onclick="setRecFilter('bezahlt',this)">Bezahlt</button>
      </div>
      <div id="rec-summen" class="bilanz-card" style="margin-bottom:16px"></div>
      <div id="rechnungen-list"></div>
    </div>

    <!-- RECHNUNG FORM -->
    <div id="v-rechnung-form" class="view">
      <div class="page-title">
        <button class="back-btn" onclick="showPage('rechnungen')">←</button>
        <h2>Neue Rechnung</h2>
      </div>
      <div class="card">
        <div class="f-group"><label>Rechnungsnummer *</label><input id="r-nr" placeholder="z.B. PO-2026-0001"></div>
        <div class="f-group"><label>Kunde *</label>
          <select id="r-kunde" onchange="loadEinsaetzeForRec()"><option value="">-- Kunde wählen --</option></select>
        </div>
        <div class="f-row">
          <div class="f-group"><label>Rechnungsdatum</label><input id="r-datum" type="date"></div>
          <div class="f-group"><label>Monat</label><input id="r-monat" type="month" onchange="loadEinsaetzeForRec()"></div>
        </div>
        <div class="f-group"><label>Lieferdatum</label><input id="r-liefer" type="date"></div>
        <div class="f-group"><label>Ansprechpartner</label><input id="r-ansp" value="Karin Koch"></div>
      </div>
      <div class="card" id="r-einsaetze-card" style="display:none">
        <div class="card-title">Einsätze auswählen</div>
        <div id="r-einsaetze-list"></div>
      </div>
      <div class="card" id="r-betrag-card" style="display:none">
        <div class="card-title">Betrag</div>
        <div id="r-betrag-info"></div>
      </div>
      <button class="btn btn-full btn-green" onclick="saveRechnung()" style="margin-bottom:20px">🧾 Rechnung speichern</button>
    </div>

    <!-- BUCHHALTUNG -->
    <div id="v-buchhaltung" class="view">
      <div class="page-title"><h2>💰 Buchhaltung</h2></div>
      <div class="filter-tabs">
        <button class="filter-tab active" onclick="setBuchFilter('uebersicht',this)">Übersicht</button>
        <button class="filter-tab" onclick="setBuchFilter('ausgaben',this)">Ausgaben</button>
        <button class="filter-tab" onclick="setBuchFilter('export',this)">Export</button>
      </div>
      <div id="buch-uebersicht"></div>
      <div id="buch-ausgaben" class="hide">
        <button class="btn btn-red btn-full" style="margin-bottom:16px" onclick="toggleAusgabeForm()">+ Neue Ausgabe</button>
        <div id="ausgabe-form" class="card hide">
          <div class="f-group"><label>Datum *</label><input id="a-datum" type="date"></div>
          <div class="f-group"><label>Kategorie *</label>
            <select id="a-kat">
              <option value="handy">📱 Handy</option>
              <option value="restaurant">🍽️ Restaurant</option>
              <option value="tankstelle">⛽ Tankstelle</option>
              <option value="fahrt">🚗 Fahrt</option>
              <option value="buero">🏢 Büro</option>
              <option value="versicherung">🛡️ Versicherung</option>
              <option value="miete">🏠 Miete</option>
              <option value="personal">👤 Personal</option>
              <option value="sonstiges">📦 Sonstiges</option>
            </select>
          </div>
          <div class="f-group"><label>Beschreibung</label><input id="a-beschr"></div>
          <div class="f-group"><label>Betrag (EUR) *</label><input id="a-betrag" type="number" step="0.01" min="0"></div>
          <div style="display:flex;gap:10px">
            <button class="btn btn-gray btn-full" onclick="toggleAusgabeForm()">Abbrechen</button>
            <button class="btn btn-red btn-full" onclick="saveAusgabe()">Speichern</button>
          </div>
        </div>
        <div id="ausgaben-list"></div>
      </div>
      <div id="buch-export" class="hide">
        <div class="card">
          <div class="card-title">CSV Export</div>
          <button class="btn btn-primary btn-full" style="margin-bottom:10px" onclick="exportCSV('kunden')">👥 Kunden exportieren</button>
          <button class="btn btn-full" style="background:var(--pur);color:#fff;margin-bottom:10px" onclick="exportCSV('einsaetze')">📋 Einsätze exportieren</button>
          <button class="btn btn-green btn-full" style="margin-bottom:10px" onclick="exportCSV('rechnungen')">🧾 Rechnungen exportieren</button>
          <button class="btn btn-red btn-full" style="margin-bottom:10px" onclick="exportCSV('ausgaben')">💸 Ausgaben exportieren</button>
          <button class="btn btn-full" style="background:var(--orn);color:#fff" onclick="exportCSV('einnahmen')">💰 Einnahmen exportieren</button>
        </div>
      </div>
    </div>

    <!-- KALENDER -->
    <div id="v-kalender" class="view">
      <div class="page-title">
        <h2>📅 Kalender</h2>
        <button class="btn btn-sm" style="background:var(--orn);color:#fff" onclick="showPage('termin-neu')">+ Neu</button>
      </div>
      <div id="kalender-list"></div>
    </div>

    <!-- TERMIN FORM -->
    <div id="v-termin-form" class="view">
      <div class="page-title">
        <button class="back-btn" onclick="showPage('kalender')">←</button>
        <h2>Neuer Termin</h2>
      </div>
      <div class="card">
        <div class="f-group"><label>Titel *</label><input id="t-titel"></div>
        <div class="f-row">
          <div class="f-group"><label>Datum *</label><input id="t-datum" type="date"></div>
          <div class="f-group"><label>Uhrzeit</label><input id="t-uhrzeit" type="time"></div>
        </div>
        <div class="f-group"><label>Typ</label>
          <div class="chip-group" id="t-typ-chips"></div>
        </div>
        <div class="f-group"><label>Kunde</label>
          <select id="t-kunde"><option value="">-- Kein Kunde --</option></select>
        </div>
        <div class="f-group"><label>Ort</label><input id="t-ort"></div>
        <div class="f-group"><label>Notiz</label><textarea id="t-notiz" rows="3"></textarea></div>
      </div>
      <button class="btn btn-full" style="background:var(--orn);color:#fff;margin-bottom:20px" onclick="saveTermin()">📅 Termin speichern</button>
    </div>

    <!-- AUFGABEN -->
    <div id="v-aufgaben" class="view">
      <div class="page-title">
        <h2>✅ Aufgaben</h2>
        <button class="btn btn-sm" style="background:var(--blue);color:#fff" onclick="toggleAufgabeForm()">+ Neu</button>
      </div>
      <div id="aufgabe-form" class="card hide">

function sbHeaders(extra={}) {
  return {'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}`, ...extra};
}
async function sbGet(table, params='') {
  const r = await fetch(`${SB_URL}/rest/v1/${table}?${params}`, {
    headers: sbHeaders()
  });
  if(!r.ok) { console.error('sbGet error:', r.status, await r.text()); return []; }
  return r.json();
}
async function sbPost(table, data) {
  const r = await fetch(`${SB_URL}/rest/v1/${table}`, {
    method: 'POST',
    headers: sbHeaders({'Content-Type': 'application/json', 'Prefer': 'return=representation'}),
    body: JSON.stringify(data)
  });
  if(!r.ok) { console.error('sbPost error:', r.status, await r.text()); return null; }
  return r.json();
}
async function sbPatch(table, id, data) {
  const r = await fetch(`${SB_URL}/rest/v1/${table}?id=eq.${id}`, {
    method: 'PATCH',
    headers: sbHeaders({'Content-Type': 'application/json', 'Prefer': 'return=representation'}),
    body: JSON.stringify(data)
  });
  if(!r.ok) { console.error('sbPatch error:', r.status, await r.text()); return null; }

}
async function sbDelete(table, id) {
  const r = await fetch(`${SB_URL}/rest/v1/${table}?id=eq.${id}`, {
    method: 'DELETE',
    headers: sbHeaders()
  });
  if(!r.ok) console.error('sbDelete error:', r.status, await r.text());
}

function setupCanvas() {
  const canvas=document.getElementById('e-canvas');
  const ctx=canvas.getContext('2d');
  ctx.strokeStyle='#1e3a5f'; ctx.lineWidth=2; ctx.lineCap='round';
  let drawing=false;
  const pos=e=>{const r=canvas.getBoundingClientRect();const s=e.touches?.[0]||e;return{x:(s.clientX-r.left)*(300/r.width),y:(s.clientY-r.top)*(120/r.height)};}
  canvas.addEventListener('mousedown',e=>{drawing=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);});
  canvas.addEventListener('mousemove',e=>{if(!drawing)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();});
  canvas.addEventListener('mouseup',()=>drawing=false);
  canvas.addEventListener('touchstart',e=>{drawing=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);},{passive:true});
  canvas.addEventListener('touchmove',e=>{e.preventDefault();if(!drawing)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();},{passive:false});
  canvas.addEventListener('touchend',()=>drawing=false);
}
function clearCanvas() { const c=document.getElementById('e-canvas');c.getContext('2d').clearRect(0,0,300,120); }

function openEinsatzForm() {

document.getElementById('e-anfang').addEventListener('input',updateStunden);

function updateStunden() {
  const a=document.getElementById('e-anfang').value;
  const e=document.getElementById('e-ende').value;
  const info=document.getElementById('e-stunden-info');
  if(a&&e) {
    const diff=((parseInt(e.split(':')[0])*60+parseInt(e.split(':')[1]))-(parseInt(a.split(':')[0])*60+parseInt(a.split(':')[1])))/60;
    if(diff>0) { info.textContent='⏱ '+diff.toFixed(2)+' Stunden'; info.style.display='block'; }
    else { info.textContent='⚠️ Endzeit muss nach Anfangszeit liegen'; info.style.color='var(--red)'; info.style.display='block'; }
  } else info.style.display='none';
}
function updateKmInfo() {
  const km=parseFloat(document.getElementById('e-km').value)||0;
  const info=document.getElementById('e-km-info');
  if(km>0) info.textContent=km<=10?'Fahrtkosten: 5,00 EUR (Pauschale)':'Fahrtkosten: '+(km*0.5).toFixed(2)+' EUR';
  else info.textContent='';
}

async function saveEinsatz() {

  if(anfang&&ende) {
    stunden=((parseInt(ende.split(':')[0])*60+parseInt(ende.split(':')[1]))-(parseInt(anfang.split(':')[0])*60+parseInt(anfang.split(':')[1])))/60;
    if(stunden<=0) return toast('Endzeit muss nach Anfangszeit liegen',false);

  const data={
    kunde_id:kundeId, datum, anfang, ende,
    stunden:parseFloat(stunden.toFixed(2)),
    leistungsart:document.getElementById('e-leistung').value,
    aktivitaeten:getSelectedChips('e-aktivitaeten'),

    verfuegbar.map(e=>`
    <label style="display:flex;align-items:center;gap:8px;margin-bottom:8px;cursor:pointer;padding:10px;background:var(--bg);border-radius:8px">
      <input type="checkbox" value="${e.id}" onchange="toggleEinsatzRec(this,JSON.parse(decodeURIComponent('${encodeURIComponent(JSON.stringify(e))}')))">
      <span style="flex:1;font-size:.85rem"><strong>${e.datum}</strong> · ${e.leistungsart} · ${e.stunden}h${e.km>0?' · '+e.km+'km':''}</span>
    </label>`).join('');
  updateRecBetrag();
}

function toggleAllEinsaetze(cb,monat,kundeId) {
  const alle=einsaetze.filter(e=>e.kunde_id===kundeId&&(e.datum||'').startsWith(monat)&&!e.abgerechnet);
  document.querySelectorAll('#r-einsaetze-list input[type=checkbox][value]').forEach(c=>c.checked=cb.checked);
  selectedEinsaetze=cb.checked?[...alle]:[];
  updateRecBetrag();
}

function toggleEinsatzRec(cb,e) {
  if(cb.checked) selectedEinsaetze.push(e);
  else selectedEinsaetze=selectedEinsaetze.filter(x=>x.id!==e.id);
  updateRecBetrag();
}

function calcNetto() {
  let n=0;
  selectedEinsaetze.forEach(e=>{
    if(e.leistungsart==='Alltagsbegleitung') n+=(e.stunden||0)*28.61;
    else if(e.leistungsart==='Coaching 1h') n+=(e.stunden||0)*67.23;
    else if(e.leistungsart==='Coaching 4h') n+=(e.stunden||0)*42.02;
    if((e.km||0)>0&&(e.km||0)<=10) n+=5;
    else if((e.km||0)>10) n+=(e.km||0)*0.5;
  });
  return n;
}

function updateRecBetrag() {
  const card=document.getElementById('r-betrag-card');
  if(selectedEinsaetze.length===0) { card.style.display='none'; return; }
  const n=calcNetto();
  card.style.display='block';
  document.getElementById('r-betrag-info').innerHTML=`
    <div style="display:flex;justify-content:space-between;margin-bottom:6px"><span>Netto:</span><strong>${n.toFixed(2)} EUR</strong></div>
    <div style="display:flex;justify-content:space-between;margin-bottom:6px"><span>MwSt. 19%:</span><strong>${(n*.19).toFixed(2)} EUR</strong></div>
    <div style="display:flex;justify-content:space-between;font-size:1.1rem;color:var(--grn);border-top:1.5px solid var(--brd);padding-top:8px;margin-top:4px"><span>Brutto:</span><strong>${(n*1.19).toFixed(2)} EUR</strong></div>`;
}

async function saveRechnung() {
  const nr=document.getElementById('r-nr').value.trim();
  if(!nr) return toast('Rechnungsnummer ist Pflichtfeld',false);
  const kundeId=document.getElementById('r-kunde').value;
  if(!kundeId) return toast('Bitte Kunden wählen',false);
  if(selectedEinsaetze.length===0) return toast('Bitte Einsätze auswählen',false);
  const n=calcNetto();
  const k=kunden.find(x=>x.id===kundeId);
  const data={
    rechnungsnummer:nr,
    kunde_id:kundeId,
    datum:document.getElementById('r-datum').value,
    lieferdatum:document.getElementById('r-liefer').value,
    monat:document.getElementById('r-monat').value,
    ansprechpartner:document.getElementById('r-ansp').value,
    netto:parseFloat(n.toFixed(2)),
    mwst:parseFloat((n*.19).toFixed(2)),
    brutto:parseFloat((n*1.19).toFixed(2)),
    bezahlt:false,
    einsatz_ids:selectedEinsaetze.map(e=>e.id)
  };
  await sbPost('rechnungen',data);
  for(const e of selectedEinsaetze) await sbPatch('einsaetze',e.id,{abgerechnet:true});
  toast('Rechnung gespeichert');
  await loadAll();
  showPage('rechnungen');
}

function setRecFilter(f,btn) {
  recFilter=f;
  document.querySelectorAll('#v-rechnungen .filter-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderRechnungen();
}

function renderRechnungen() {
  const filtered=rechnungen.filter(r=>recFilter==='alle'?true:recFilter==='offen'?!r.bezahlt:r.bezahlt);
  const gesamt=filtered.reduce((s,r)=>s+(r.brutto||0),0);
  const bezahlt=filtered.filter(r=>r.bezahlt).reduce((s,r)=>s+(r.brutto||0),0);
  document.getElementById('rec-summen').innerHTML=`
    <div style="display:flex;justify-content:space-between">
      <div><div style="font-size:.75rem;opacity:.85">Gesamt</div><div style="font-size:1.2rem;font-weight:800">${gesamt.toFixed(2)} EUR</div></div>
      <div style="text-align:right"><div style="font-size:.75rem;opacity:.85">Bezahlt</div><div style="font-size:1.2rem;font-weight:800">${bezahlt.toFixed(2)} EUR</div></div>
    </div>`;
  document.getElementById('rechnungen-list').innerHTML=filtered.length===0?'<div style="text-align:center;padding:40px;color:var(--txt2)">Keine Rechnungen</div>':
    filtered.map(r=>{
      const k=kunden.find(x=>x.id===r.kunde_id);
      return `<div class="list-item">
        <div class="list-item-left">
          <div class="list-item-title">${r.rechnungsnummer||'-'}</div>
          <div class="list-item-sub">${k?k.vorname+' '+k.name:'-'} · ${r.datum}</div>
          <div style="font-weight:800;color:var(--grn)">${(r.brutto||0).toFixed(2)} EUR</div>
        </div>
        <div class="list-item-right" style="flex-direction:column;align-items:flex-end;gap:6px">
          <span class="badge ${r.bezahlt?'badge-green':'badge-yellow'}">${r.bezahlt?'✓ Bezahlt':'⏳ Offen'}</span>
          <button class="btn btn-sm btn-gray" onclick="toggleBezahlt('${r.id}',${r.bezahlt})">${r.bezahlt?'Als offen':'Als bezahlt'}</button>
          <button class="btn btn-sm" style="background:#fee2e2" onclick="delRechnung('${r.id}')">🗑️</button>
        </div>
      </div>`;
    }).join('');
}

async function toggleBezahlt(id,aktuell) {
  await sbPatch('rechnungen',id,{bezahlt:!aktuell});
  await loadAll();
}
async function delRechnung(id) {
  if(!confirm('Rechnung löschen?')) return;
  await sbDelete('rechnungen',id);
  toast('Rechnung gelöscht');
  await loadAll();
}

// ── BUCHHALTUNG ───────────────────────────────────────────
function setBuchFilter(f,btn) {
  buchFilter=f;
  document.querySelectorAll('#v-buchhaltung .filter-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  ['uebersicht','ausgaben','export'].forEach(x=>document.getElementById('buch-'+x).classList.toggle('hide',x!==f));
}

function renderBuchhaltung() {
  const einnahmen=rechnungen.filter(r=>r.bezahlt).reduce((s,r)=>s+(r.brutto||0),0);
  const ausstehend=rechnungen.filter(r=>!r.bezahlt).reduce((s,r)=>s+(r.brutto||0),0);
  const ausgabenSum=ausgaben.reduce((s,a)=>s+(a.betrag||0),0);
  const gewinn=einnahmen-ausgabenSum;
  document.getElementById('buch-uebersicht').innerHTML=`
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
      <div class="stat-card" style="border-left:4px solid var(--grn)"><div class="stat-val" style="color:var(--grn)">${einnahmen.toFixed(2)}</div><div class="stat-lbl">Einnahmen EUR</div></div>
      <div class="stat-card" style="border-left:4px solid #d97706"><div class="stat-val" style="color:#d97706">${ausstehend.toFixed(2)}</div><div class="stat-lbl">Ausstehend EUR</div></div>
      <div class="stat-card" style="border-left:4px solid var(--red)"><div class="stat-val" style="color:var(--red)">${ausgabenSum.toFixed(2)}</div><div class="stat-lbl">Ausgaben EUR</div></div>
      <div class="stat-card" style="border-left:4px solid ${gewinn>=0?'var(--grn)':'var(--red)'}"><div class="stat-val" style="color:${gewinn>=0?'var(--grn)':'var(--red)'}">${gewinn.toFixed(2)}</div><div class="stat-lbl">Gewinn EUR</div></div>
    </div>`;
  renderAusgabenList();
}

function renderAusgabenList() {
  document.getElementById('ausgaben-list').innerHTML=ausgaben.length===0?'<div style="text-align:center;padding:30px;color:var(--txt2)">Keine Ausgaben</div>':
    ausgaben.map(a=>`
    <div class="list-item">
      <div class="list-item-left">
        <div class="list-item-title">${KAT_ICONS[a.kategorie]||'📦'} ${a.kategorie}</div>
        <div class="list-item-sub">${a.datum}${a.beschreibung?' · '+a.beschreibung:''}</div>
      </div>
      <div class="list-item-right">
        <span style="font-weight:800;color:var(--red)">${(a.betrag||0).toFixed(2)} EUR</span>
        <button class="btn btn-sm" style="background:#fee2e2" onclick="delAusgabe('${a.id}')">🗑️</button>
      </div>
    </div>`).join('');
}

function toggleAusgabeForm() {
  const f=document.getElementById('ausgabe-form');
  f.classList.toggle('hide');
  if(!f.classList.contains('hide')) document.getElementById('a-datum').value=new Date().toISOString().split('T')[0];
}

async function saveAusgabe() {
  const datum=document.getElementById('a-datum').value;
  const betrag=parseFloat(document.getElementById('a-betrag').value);
  if(!datum||!betrag) return toast('Datum und Betrag sind Pflichtfelder',false);
  await sbPost('ausgaben',{
    datum, kategorie:document.getElementById('a-kat').value,
    beschreibung:document.getElementById('a-beschr').value,
    betrag
  });
  toast('Ausgabe gespeichert');
  document.getElementById('ausgabe-form').classList.add('hide');
  await loadAll();
}

async function delAusgabe(id) {
  if(!confirm('Ausgabe löschen?')) return;
  await sbDelete('ausgaben',id);
  await loadAll();
}

// ── EXPORT ────────────────────────────────────────────────
function exportCSV(type) {
  let rows=[],headers=[],name='';
  if(type==='kunden') {
    headers=['kundennummer','name','vorname','geburtsdatum','adresse','festnetz','handy','email','status','arzt','praxis','apotheke'];
    rows=kunden; name='Kunden';
  } else if(type==='einsaetze') {
    headers=['datum','anfang','ende','stunden','leistungsart','km','abgerechnet','notizen'];
    rows=einsaetze.map(e=>{const k=kunden.find(x=>x.id===e.kunde_id);return{...e,kundenname:k?k.vorname+' '+k.name:''}});
    headers=['datum','kundenname','anfang','ende','stunden','leistungsart','km','abgerechnet'];
    name='Einsaetze';
  } else if(type==='rechnungen') {
    rows=rechnungen.map(r=>{const k=kunden.find(x=>x.id===r.kunde_id);return{...r,kundenname:k?k.vorname+' '+k.name:'',bezahlt_text:r.bezahlt?'Ja':'Nein'}});
    headers=['rechnungsnummer','kundenname','datum','monat','netto','mwst','brutto','bezahlt_text'];
    name='Rechnungen';
  } else if(type==='ausgaben') {
    headers=['datum','kategorie','beschreibung','betrag'];
    rows=ausgaben; name='Ausgaben';
  } else if(type==='einnahmen') {
    rows=rechnungen.filter(r=>r.bezahlt).map(r=>{const k=kunden.find(x=>x.id===r.kunde_id);return{...r,kundenname:k?k.vorname+' '+k.name:''}});
    headers=['rechnungsnummer','kundenname','datum','brutto'];
    name='Einnahmen';
  }
  const lines=[headers.join(';')];
  rows.forEach(r=>lines.push(headers.map(h=>{const v=String(r[h]===undefined||r[h]===null?'':r[h]).replace(/"/g,'""');return v.includes(';')||v.includes('"')?'"'+v+'"':v;}).join(';')));
  const blob=new Blob(['﻿'+lines.join('
')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='PlanetOrdnung_'+name+'_'+new Date().toISOString().slice(0,10)+'.csv';a.click();
  toast(name+' exportiert');
}

// ── KALENDER ─────────────────────────────────────────────
function openTerminForm() {
  document.getElementById('t-titel').value='';
  document.getElementById('t-datum').value=new Date().toISOString().split('T')[0];
  document.getElementById('t-uhrzeit').value='';
  document.getElementById('t-ort').value='';
  document.getElementById('t-notiz').value='';
  currentTerminTyp='allgemein';
  document.querySelectorAll('#t-typ-chips .chip').forEach((b,i)=>b.classList.toggle('active',i===0));
}
function setTerminTyp(typ,btn) {
  currentTerminTyp=typ;
  document.querySelectorAll('#t-typ-chips .chip').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

async function saveTermin() {
  const titel=document.getElementById('t-titel').value.trim();
  const datum=document.getElementById('t-datum').value;
  if(!titel||!datum) return toast('Titel und Datum sind Pflichtfelder',false);
  await sbPost('termine',{
    titel, datum,
    uhrzeit:document.getElementById('t-uhrzeit').value,
    typ:currentTerminTyp,
    kunde_id:document.getElementById('t-kunde').value||null,
    ort:document.getElementById('t-ort').value,
    notiz:document.getElementById('t-notiz').value
  });
  toast('Termin gespeichert');
  await loadAll();
  showPage('kalender');
}

function renderKalender() {
  const heute=new Date().toISOString().split('T')[0];
  const kommend=termine.filter(t=>t.datum>=heute).slice(0,15);
  const vergangen=termine.filter(t=>t.datum<heute).slice(0,5);
  document.getElementById('kalender-list').innerHTML=
    (kommend.length===0?'<div style="text-align:center;padding:40px;color:var(--txt2)">Keine anstehenden Termine</div>':
      kommend.map(t=>terminCard(t,heute)).join(''))+
    (vergangen.length>0?'<div style="font-weight:700;color:var(--txt3);font-size:.8rem;margin:20px 0 10px">VERGANGENE TERMINE</div>'+vergangen.map(t=>terminCard(t,heute,true)).join(''):'');
}

function terminCard(t,heute,vergangen=false) {
  const typ=TERMIN_TYPEN.find(x=>x.id===t.typ)||TERMIN_TYPEN[0];
  const k=kunden.find(x=>x.id===t.kunde_id);
  return `<div class="list-item" style="border-left:4px solid ${typ.color};opacity:${vergangen?.7:1}">
    <div class="list-item-left">
      ${t.datum===heute?'<div style="font-size:.7rem;font-weight:700;color:var(--red);margin-bottom:3px">📍 HEUTE</div>':''}
      <div class="list-item-title">${t.titel}</div>
      <div class="list-item-sub">${t.datum}${t.uhrzeit?' · '+t.uhrzeit+' Uhr':''}${t.ort?' · '+t.ort:''}</div>
      ${k?'<div style="font-size:.75rem;color:'+typ.color+';font-weight:600">👤 '+k.vorname+' '+k.name+'</div>':''}
      <span class="badge" style="background:${typ.color}20;color:${typ.color}">${typ.label}</span>
    </div>
    <button class="btn btn-sm" style="background:#fee2e2" onclick="delTermin('${t.id}')">🗑️</button>
  </div>`;
}

async function delTermin(id) {
  if(!confirm('Termin löschen?')) return;
  await sbDelete('termine',id);
  await loadAll();
}

// ── AUFGABEN ─────────────────────────────────────────────
function toggleAufgabeForm() {
  const f=document.getElementById('aufgabe-form');
  f.classList.toggle('hide');
  if(!f.classList.contains('hide')) {
    document.getElementById('auf-titel').value='';
    document.getElementById('auf-faellig').value='';
    document.getElementById('auf-notiz').value='';
    currentPrio='mittel';
  }
}
function setPrio(p,btn) {
  currentPrio=p;
  document.querySelectorAll('#aufgabe-form .chip').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
function setAufgabeFilter(f,btn) {
  aufgabeFilter=f;
  document.querySelectorAll('#v-aufgaben .filter-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderAufgaben();
}
async function saveAufgabe() {
  const titel=document.getElementById('auf-titel').value.trim();
  if(!titel) return toast('Titel ist Pflichtfeld',false);
  await sbPost('aufgaben',{titel,prioritaet:currentPrio,faellig:document.getElementById('auf-faellig').value||null,notiz:document.getElementById('auf-notiz').value,erledigt:false});
  toast('Aufgabe gespeichert');
  toggleAufgabeForm();
  await loadAll();
}
async function toggleAufgabe(id,aktuell) {
  await sbPatch('aufgaben',id,{erledigt:!aktuell});
  await loadAll();
}
async function delAufgabe(id) {
  if(!confirm('Aufgabe löschen?')) return;
  await sbDelete('aufgaben',id);
  await loadAll();
}
function renderAufgaben() {
  const heute=new Date().toISOString().split('T')[0];
  const filtered=aufgaben.filter(a=>aufgabeFilter==='alle'?true:aufgabeFilter==='offen'?!a.erledigt:a.erledigt);
  const PRIO={hoch:{icon:'🔴',color:'var(--red)'},mittel:{icon:'🟡',color:'#d97706'},niedrig:{icon:'🟢',color:'var(--grn)'}};
  document.getElementById('aufgaben-list').innerHTML=filtered.length===0?'<div style="text-align:center;padding:40px;color:var(--txt2)">Keine Aufgaben</div>':
    filtered.map(a=>{
      const p=PRIO[a.prioritaet]||PRIO.mittel;
      const ueberfaellig=a.faellig&&a.faellig<heute&&!a.erledigt;
      return `<div class="list-item" style="border-left:4px solid ${p.color};opacity:${a.erledigt?.6:1};align-items:flex-start;gap:12px">
        <input type="checkbox" ${a.erledigt?'checked':''} onchange="toggleAufgabe('${a.id}',${a.erledigt})" style="width:20px;height:20px;margin-top:3px;cursor:pointer;accent-color:var(--blue2)">
        <div style="flex:1">
          <div class="list-item-title" style="text-decoration:${a.erledigt?'line-through':'none'}">${a.titel}</div>
          ${a.faellig?'<div style="font-size:.75rem;color:'+(ueberfaellig?'var(--red)':'var(--txt2)')+';font-weight:'+(ueberfaellig?'700':'400')+'">'+(ueberfaellig?'⚠️ Überfällig: ':'📅 Fällig: ')+a.faellig+'</div>':''}
          ${a.notiz?'<div style="font-size:.78rem;color:var(--txt2);margin-top:3px">'+a.notiz+'</div>':''}
          <span style="font-size:.75rem">${p.icon} ${a.prioritaet}</span>
        </div>
        <button class="btn btn-sm" style="background:#fee2e2" onclick="delAufgabe('${a.id}')">🗑️</button>
      </div>`;
    }).join('');
}

init();
</script>
